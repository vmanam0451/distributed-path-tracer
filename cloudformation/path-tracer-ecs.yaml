AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Infrastructure for Path Tracer

Resources:
  VPC:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./path-tracer-vpc.yaml 

  # ECS Cluster
  PathTracerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: PathTracerCluster
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      Tags:
        - Key: Name
          Value: PathTracer-Cluster

  # IAM Roles
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Tags:
        - Key: Name
          Value: PathTracer-ECSTaskExecutionRole

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3FullAccess'
        - 'arn:aws:iam::aws:policy/AmazonSNSFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonSQSFullAccess'
      Tags:
        - Key: Name
          Value: PathTracer-ECSTaskRole

  # Task Definition
  PathTracerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: path-tracer-worker
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      Cpu: '1024'  # Default 1 vCPU
      Memory: '2048'  # Default 2GB
      ContainerDefinitions:
        - Name: worker
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/distributed-path-tracer-repo/path-tracer-core:latest
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PathTracerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
      Tags:
        - Key: Name
          Value: PathTracer-TaskDefinition

  # Log Group
  PathTracerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/path-tracer
      RetentionInDays: 1

Outputs:
  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref PathTracerCluster

  ClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt PathTracerCluster.Arn

  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref PathTracerTaskDefinition